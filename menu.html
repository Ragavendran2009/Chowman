<title>Chowman Arekere — Menu</title>
<style>
:root{--ink:#1c1611;--red:#9c2b2f;--dark:#6f1c1f;--green:#4f6f52;--paper:#f3ecdd;--white:#fff;--gold:#d4a73d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:10;background:rgba(243,236,221,.97);border-bottom:2px solid var(--ink)}
nav{max-width:1120px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:25px;font-weight:900}.logo span{color:var(--red)}
a{color:inherit;text-decoration:none}.back{font-weight:700}.call{background:var(--red);color:white;padding:9px 16px;border:2px solid var(--ink);font-weight:700}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
.hero{padding:42px 0 25px;border-bottom:2px solid var(--ink)}
.eyebrow{color:var(--red);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
h1{font-size:clamp(42px,8vw,76px);line-height:.9;margin-top:7px;text-transform:uppercase}
.hero p{margin-top:14px;max-width:650px;color:#51463b}
.controls{position:sticky;top:60px;z-index:9;background:var(--paper);border-bottom:2px solid var(--ink);padding:14px 0}
.search{display:flex;gap:10px}
input{width:100%;padding:12px 14px;border:2px solid var(--ink);font-size:15px;background:white}
.filters{display:flex;gap:8px;overflow:auto;margin-top:10px;padding-bottom:3px}
button{border:2px solid var(--ink);background:white;padding:9px 13px;font-weight:700;cursor:pointer;white-space:nowrap}
button.active{background:var(--ink);color:var(--paper)}
button.veg.active{background:var(--green)}button.nonveg.active{background:var(--red)}
main{padding:30px 0 70px}
.category{font-size:28px;text-transform:uppercase;margin:30px 0 12px;border-top:2px solid var(--ink);padding-top:9px}
.category:first-child{margin-top:0;border-top:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--ink);border:1px solid var(--ink)}
.item{background:var(--paper);padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.name{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.dot{width:11px;height:11px;border:2px solid var(--green);display:inline-block;position:relative;flex:none}
.dot:after{content:"";width:5px;height:5px;background:var(--green);border-radius:50%;position:absolute;left:1px;top:1px}
.dot.nv{border-color:var(--red)}.dot.nv:after{background:var(--red);border-radius:0;clip-path:polygon(50% 0,0 100%,100% 100%)}
.price{font-family:monospace;color:var(--dark);font-weight:800;white-space:nowrap}
.hidden{display:none!important}
.empty{text-align:center;padding:60px 20px;color:#6b5f49}
footer{text-align:center;border-top:2px solid var(--ink);padding:25px;color:#6b5f49;font-size:13px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.back{display:none}.item{padding:13px 11px}}
</style>
</head>
<body>
<header><nav>

<section class="hero"><div class="wrap">

</div></section>

<section class="controls"><div class="wrap">

    <button class="veg" data-diet="veg">Veg</button>
    <button class="nonveg" data-diet="nonveg">Non-Veg</button>
  </div>
</div></section>

<main><div class="wrap" id="menu"></div></main>

const menu=document.getElementById("menu"), search=document.getElementById("search");
let category="all", diet="all";

function render(){
  const q=search.value.trim().toLowerCase();
  menu.innerHTML="";
  let total=0;
  for(const [cat,items] of Object.entries(MENU)){
    if(category!=="all" && category!==cat) continue;
    const filtered=items.filter(([name,,d])=>
      (!q || name.toLowerCase().includes(q)) && (diet==="all" || d===diet)
    );
    if(!filtered.length) continue;
    total+=filtered.length;
    const section=document.createElement("section");
    section.innerHTML=`<h2 class="category">${cat}</h2><div class="grid"></div>`;
    const grid=section.querySelector(".grid");
    filtered.forEach(([name,price,d])=>{
      const item=document.createElement("div");
      item.className="item";
      item.innerHTML=`<div class="name"><span class="dot ${d==="nonveg"?"nv":""}"></span>${name}</div><div class="price">₹${price}</div>`;
      grid.appendChild(item);
    });
    menu.appendChild(section);
  }
  if(!total) menu.innerHTML='<div class="empty">No dishes found. Try another search or filter.</div>';
}
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-cat]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); category=b.dataset.cat; render();
});
document.querySelectorAll("[data-diet]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-diet]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); diet=b.dataset.diet; render();
});
search.addEventListener("input",render);
render();
